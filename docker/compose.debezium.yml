# Debezium stack. Host ports do not overlap with servlet, reactive, or VT.
# Order 8096, stub 8097, Connect REST 8087, Postgres 5435, Kafka 19095.
# notification-stub is built from the local Dockerfile. The released GHCR image cannot read order-payload.
name: outbox-debezium

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: outbox_debezium
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "5435:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_debezium"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "19095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    network_mode: "service:kafka"
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka..."
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic orders.events \
          --partitions 10 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-configs \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-offsets \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-status \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        echo "Topic orders.events and Connect topics are ready"

  order-service-debezium:
    build:
      context: ../order-service-debezium
    ports:
      - "8096:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: outbox_debezium
      DB_USER: outbox
      DB_PASSWORD: outbox
      SERVER_PORT: "8086"
      LOG_JSON_PATH: /var/log/app
      DEPLOYMENT_ENV: local
      TRACING_ENABLED: "false"
    volumes:
      - ../logs/debezium:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy

  notification-stub:
    build:
      context: ../notification-stub
    ports:
      - "8097:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: outbox_debezium
      DB_USER: outbox
      DB_PASSWORD: outbox
      KAFKA_BOOTSTRAP: kafka:29092
      LOG_JSON_PATH: /var/log/app
      DEPLOYMENT_ENV: local
      TRACING_ENABLED: "false"
    volumes:
      - ../logs/debezium:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      order-service-debezium:
        condition: service_healthy

  connect:
    # 3.2.4.Final is the newest published 3.2 image with publish.via.partition.root.
    # 3.2.7.Final (Kafka Connect 3.9.1) is not on Quay.
    image: quay.io/debezium/connect:3.2.4.Final
    ports:
      - "8087:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: outbox-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  connect-init:
    image: curlimages/curl:8.17.0
    depends_on:
      connect:
        condition: service_started
      order-service-debezium:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./debezium/outbox-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka Connect..."
        ready=0
        for i in $$(seq 1 60); do
          if curl -sf http://connect:8083/connectors >/dev/null; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$$ready" -ne 1 ]; then
          echo "Kafka Connect did not become ready"
          exit 1
        fi
        if curl -sf http://connect:8083/connectors/outbox-events >/dev/null; then
          echo "Connector outbox-events is already registered"
          exit 0
        fi
        curl -sf -X POST -H "Content-Type: application/json" \
          --data @/connector.json \
          http://connect:8083/connectors
        echo "Connector outbox-events is registered"
